<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Hardware Simulator</title>
    <style>
        :root {
            --background: #101214;
            --surface: #191d21;
            --surface-2: #232930;
            --border: #343c45;
            --text: #f1f5f9;
            --muted: #9aa7b4;
            --primary: #4f8cff;
            --on: #2e7d32;
            --off: #68717c;
            --error: #c62828;
            --disconnected: #f57c00;
            --camera: #7c4dff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 2;
            display: grid;
            grid-template-columns: 1fr minmax(260px, 520px);
            gap: 16px;
            align-items: center;
            padding: 16px 20px;
            background: rgba(16, 18, 20, 0.96);
            border-bottom: 1px solid var(--border);
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }

        .connect-row {
            display: flex;
            gap: 8px;
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 9px 12px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        button.secondary {
            background: #3a424c;
        }

        button:hover {
            filter: brightness(1.08);
        }

        main {
            padding: 20px;
        }

        #status-bar {
            margin-bottom: 16px;
            color: var(--muted);
            font-size: 14px;
        }

        .floor-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
            align-items: start;
        }

        .floor-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .floor-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .floor-name {
            font-size: 16px;
            font-weight: 700;
        }

        .floor-meta {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
        }

        .device-count {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .grid-wrap {
            padding: 14px;
        }

        .floor-grid {
            display: grid;
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1px solid var(--border);
            background: #12171c;
        }

        .cell {
            position: relative;
            min-width: 0;
            min-height: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .device {
            position: absolute;
            inset: 8%;
            display: flex;
            align-items: center;
            justify-content: center;
            place-items: center;
            border-radius: 6px;
            border: 2px solid var(--off);
            background: rgba(104, 113, 124, 0.18);
            color: var(--text);
            cursor: pointer;
            overflow: hidden;
        }

        .device.selected {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .device.ON {
            border-color: var(--on);
            background: rgba(46, 125, 50, 0.2);
        }

        .device.ERROR {
            border-color: var(--error);
            background: rgba(198, 40, 40, 0.2);
        }

        .device.DISCONNECTED {
            border-color: var(--disconnected);
            background: rgba(245, 124, 0, 0.2);
        }

        .device.CAMERA {
            border-color: var(--camera);
        }

        .icon {
            display: inline-grid;
            width: clamp(22px, 5vw, 34px);
            height: clamp(22px, 5vw, 34px);
            place-items: center;
            border-radius: 50%;
            font-size: clamp(14px, 3vw, 22px);
            font-weight: 800;
            line-height: 1;
            background: rgba(255, 255, 255, 0.08);
        }

        .icon.OUTLET::before {
            content: "P";
        }

        .icon.MULTI_SWITCH::before {
            content: "S";
        }

        .icon.IRON_SLOT::before {
            content: "I";
        }

        .icon.LIGHT_SCHEDULE::before {
            content: "L";
        }

        .icon.CAMERA::before {
            content: "C";
        }

        .selected-panel {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            min-height: 74px;
            margin: 0 14px 14px;
            padding: 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .selected-empty {
            color: var(--muted);
            font-size: 13px;
        }

        .selected-info {
            display: flex;
            min-width: 0;
            gap: 10px;
            align-items: center;
        }

        .selected-title {
            font-weight: 700;
            line-height: 1.2;
        }

        .selected-meta {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .actions button {
            padding: 6px 8px;
            font-size: 11px;
        }

        .actions button[data-status="ON"] {
            background: var(--on);
        }

        .actions button[data-status="OFF"] {
            background: var(--off);
        }

        .actions button[data-status="ERROR"] {
            background: var(--error);
        }

        .actions button[data-status="DISCONNECTED"] {
            background: var(--disconnected);
        }

        .actions button:not(.selected-status) {
            opacity: 0.45;
        }

        .actions button.selected-status {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.28) inset;
        }

        .empty {
            padding: 28px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 8px;
        }

        @media (max-width: 760px) {
            header {
                grid-template-columns: 1fr;
            }

            main {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Smart Home Hardware Simulator</h1>
            <div class="subtitle">2D grid simulation grouped by floor. Realtime updates use Firebase <code>onValue</code> listeners.</div>
        </div>
        <div class="connect-row">
            <input type="text" id="db-url" placeholder="Realtime Database URL">
            <button id="connect-btn">Connect</button>
        </div>
    </header>

    <main>
        <div id="status-bar">Waiting for Firebase database URL...</div>
        <section class="floor-list" id="floor-list">
            <div class="empty">Connect to view simulated floors and appliances.</div>
        </section>
    </main>

    <script type="module">
        import { initializeApp, getApps, deleteApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let db = null;
        let floorsData = {};
        let devicesData = {};
        const selectedDevicesByFloor = {};

        const dbUrlInput = document.getElementById("db-url");
        const connectBtn = document.getElementById("connect-btn");
        const statusBar = document.getElementById("status-bar");
        const floorList = document.getElementById("floor-list");

        const savedUrl = localStorage.getItem("sim_db_url");
        if (savedUrl) {
            dbUrlInput.value = savedUrl;
        }

        connectBtn.addEventListener("click", () => {
            const url = dbUrlInput.value.trim();
            if (!url) {
                alert("Enter Realtime Database URL");
                return;
            }
            localStorage.setItem("sim_db_url", url);
            initFirebase(url);
        });

        function initFirebase(databaseURL) {
            try {
                statusBar.textContent = "Connecting to Firebase...";
                getApps().forEach(app => deleteApp(app).catch(() => {}));

                const app = initializeApp({ databaseURL });
                db = getDatabase(app);

                onValue(ref(db, "floors"), snapshot => {
                    floorsData = snapshot.val() || {};
                    render();
                }, showError);

                onValue(ref(db, "devices"), snapshot => {
                    devicesData = snapshot.val() || {};
                    statusBar.textContent = "Connected. Realtime Firebase listeners are active.";
                    render();
                }, showError);
            } catch (error) {
                showError(error);
            }
        }

        function showError(error) {
            statusBar.textContent = `Firebase error: ${error.message}`;
        }

        function render() {
            const floors = Object.values(floorsData);
            const devices = Object.entries(devicesData).map(([id, value]) => ({ id, ...value }));

            if (floors.length === 0) {
                floorList.innerHTML = '<div class="empty">No floors found. Add floors from the mobile app.</div>';
                return;
            }

            floorList.innerHTML = "";
            floors
                .sort((a, b) => (a.name || "").localeCompare(b.name || ""))
                .forEach(floor => {
                    const floorDevices = devices.filter(device => device.floorId === floor.id);
                    floorList.appendChild(renderFloor(floor, floorDevices));
                });
        }

        function renderFloor(floor, devices) {
            const rows = clamp(Number(floor.gridRows) || 5, 2, 8);
            const cols = clamp(Number(floor.gridCols) || 5, 2, 8);
            const card = document.createElement("article");
            card.className = "floor-card";

            card.innerHTML = `
                <div class="floor-header">
                    <div>
                        <div class="floor-name">${escapeHtml(floor.name || "Unnamed Floor")}</div>
                        <div class="floor-meta">${rows} x ${cols} grid</div>
                    </div>
                    <div class="device-count">${devices.length} devices</div>
                </div>
                <div class="grid-wrap">
                    <div class="floor-grid" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, 1fr);"></div>
                </div>
                <div class="control-slot"></div>
            `;

            const grid = card.querySelector(".floor-grid");
            for (let y = 0; y < rows; y += 1) {
                for (let x = 0; x < cols; x += 1) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    const device = devices.find(item => clamp(Number(item.gridX) || 0, 0, cols - 1) === x && clamp(Number(item.gridY) || 0, 0, rows - 1) === y);
                    if (device) {
                        cell.appendChild(renderDeviceTile(device, floor.id));
                    }
                    grid.appendChild(cell);
                }
            }

            const selectedDeviceId = selectedDevicesByFloor[floor.id];
            const selectedDevice = devices.find(device => device.id === selectedDeviceId) || null;
            card.querySelector(".control-slot").appendChild(renderSelectedPanel(floor.id, selectedDevice));

            return card;
        }

        function renderDeviceTile(device, floorId) {
            const status = device.status || "OFF";
            const tile = document.createElement("button");
            const selectedClass = selectedDevicesByFloor[floorId] === device.id ? "selected" : "";
            tile.className = `device ${status} ${selectedClass} ${device.type === "CAMERA" ? "CAMERA" : ""}`;
            tile.title = `${device.name || "Device"} - ${device.type || "UNKNOWN"} - ${status}`;
            tile.innerHTML = deviceIcon(device.type);
            tile.addEventListener("click", () => {
                selectedDevicesByFloor[floorId] = device.id;
                render();
            });
            return tile;
        }

        function renderSelectedPanel(floorId, device) {
            const panelContent = document.createElement("div");
            panelContent.className = "selected-panel";
            if (!device) {
                panelContent.innerHTML = '<div class="selected-empty">Select a device on this floor grid to simulate status changes.</div>';
                return panelContent;
            }

            const status = device.status || "OFF";
            panelContent.innerHTML = `
                <div class="selected-info">
                    ${deviceIcon(device.type)}
                    <div>
                        <div class="selected-title">${escapeHtml(device.name || "Device")}</div>
                        <div class="selected-meta">${device.type || "UNKNOWN"} - ${status} - row ${(Number(device.gridY) || 0) + 1}, column ${(Number(device.gridX) || 0) + 1}</div>
                    </div>
                </div>
                <div class="actions">
                    ${statusButton("ON", status)}
                    ${statusButton("OFF", status)}
                    ${statusButton("ERROR", status)}
                    ${statusButton("DISCONNECTED", status, "Disc")}
                </div>
            `;
            panelContent.querySelectorAll("button").forEach(button => {
                button.addEventListener("click", () => updateDeviceStatus(device.id, button.dataset.status));
            });
            return panelContent;
        }

        async function updateDeviceStatus(deviceId, newStatus) {
            if (!db) {
                return;
            }

            const updates = {};
            updates[`devices/${deviceId}/status`] = newStatus;
            updates[`devices/${deviceId}/lastSimulatedAt`] = Date.now();
            updates[`devices/${deviceId}/simulatorOnline`] = true;
            if (newStatus === "ON") {
                updates[`devices/${deviceId}/turnedOnAt`] = Date.now();
            }
            if (newStatus === "OFF") {
                updates[`devices/${deviceId}/turnedOnAt`] = null;
            }

            await update(ref(db), updates);
        }

        function deviceIcon(type) {
            return `<span class="icon ${type || "DEVICE"}" aria-hidden="true"></span>`;
        }

        function statusButton(value, currentStatus, label = value) {
            const selectedClass = value === currentStatus ? "selected-status" : "";
            return `<button data-status="${value}" class="${selectedClass}">${label}</button>`;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        if (dbUrlInput.value.trim()) {
            initFirebase(dbUrlInput.value.trim());
        }
    </script>
</body>
</html>
